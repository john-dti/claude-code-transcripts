{% extends "base.html" %}

{% block title %}Claude Code sessions (live){% endblock %}

{% block content %}
        <header class="ledger-head">
            <p class="ledger-kicker">CLAUDE CODE</p>
            <h1 class="ledger-title">Live Sessions</h1>
            <p class="ledger-stats"><span id="index-status" class="watch-status down">● connecting…</span><span id="index-count"></span></p>
        </header>
        <div class="ledger-search">
            <input type="search" id="index-search" placeholder="Search title, summary, project, branch…" autocomplete="off" aria-label="Search sessions">
            <kbd title="Press / to search">/</kbd>
        </div>
        <section id="session-list"></section>
        <p id="watch-empty" class="ledger-empty" hidden></p>
{%- endblock %}
